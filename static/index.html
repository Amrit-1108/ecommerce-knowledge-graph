<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphMind · E-commerce Knowledge Graph</title>
<script>
  // apply the saved theme before the page paints (light is the default)
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  /* ---------- light theme (default) ---------- */
  :root {
    color-scheme: light;
    --bg: #f4f5fb;
    --panel: rgba(255, 255, 255, 0.82);
    --overlay: rgba(255, 255, 255, 0.96);
    --topbar: rgba(255, 255, 255, 0.7);
    --soft: rgba(20, 24, 60, 0.035);
    --input: #ffffff;
    --border: rgba(20, 24, 60, 0.08);
    --border-strong: rgba(20, 24, 60, 0.15);
    --text: #171a2c;
    --strong: #0d0f1c;
    --muted: #646a82;
    --placeholder: #a3a8bd;
    --accent: #6d5dfc;
    --accent-soft: rgba(109, 93, 252, 0.1);
    --gradient: linear-gradient(135deg, #7c6cf6 0%, #4f7fe8 50%, #1fb0a2 100%);
    --done-text: #047857;
    --done-bg: rgba(16, 185, 129, 0.12);
    --error: #c0392b;
    --code-bg: #f3f2ff;
    --code-text: #5b45d6;
    --scroll: rgba(20, 24, 60, 0.15);
    --shadow: 0 10px 40px rgba(30, 35, 90, 0.08);
    --blob: 0.13;
    /* graph colours, read by the script */
    --node-label: #2a2e45;
    --node-dim: #e6e8f1;
    --node-dim-border: #d4d7e5;
    --node-label-dim: #b9bdd0;
    --edge: rgba(60, 70, 120, 0.22);
    --edge-strong: rgba(40, 45, 90, 0.75);
    --edge-faint: rgba(60, 70, 120, 0.06);
  }

  /* ---------- dark theme ---------- */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0d17;
    --panel: rgba(22, 25, 41, 0.72);
    --overlay: rgba(15, 17, 30, 0.95);
    --topbar: rgba(11, 13, 23, 0.6);
    --soft: rgba(255, 255, 255, 0.035);
    --input: rgba(0, 0, 0, 0.3);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #eceef7;
    --strong: #ffffff;
    --muted: #8b90a8;
    --placeholder: #5d6280;
    --accent: #8b7cf6;
    --accent-soft: rgba(139, 124, 246, 0.18);
    --gradient: linear-gradient(135deg, #8b7cf6 0%, #5b8def 50%, #4fd1c5 100%);
    --done-text: #a7f3d0;
    --done-bg: rgba(52, 211, 153, 0.1);
    --error: #fca5a5;
    --code-bg: rgba(0, 0, 0, 0.35);
    --code-text: #c4b5fd;
    --scroll: rgba(255, 255, 255, 0.1);
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    --blob: 0.22;
    --node-label: #e5e7f2;
    --node-dim: #1c1f33;
    --node-dim-border: #2a2e48;
    --node-label-dim: #3d4260;
    --edge: rgba(160, 170, 210, 0.25);
    --edge-strong: rgba(255, 255, 255, 0.7);
    --edge-faint: rgba(160, 170, 210, 0.06);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }
  /* soft glowing blobs in the background */
  body::before, body::after {
    content: ""; position: fixed; width: 620px; height: 620px; border-radius: 50%;
    filter: blur(140px); opacity: var(--blob); z-index: -1; pointer-events: none;
  }
  body::before { background: #6d5dfc; top: -220px; left: -160px; }
  body::after { background: #1fb5a8; bottom: -260px; right: -160px; }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: var(--topbar); backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; background: var(--gradient);
    display: grid; place-items: center; box-shadow: 0 6px 24px rgba(109, 93, 252, 0.35);
  }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px; color: var(--muted);
    background: var(--soft); border: 1px solid var(--border);
  }
  .pill b { color: var(--text); font-weight: 600; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }
  .theme-toggle {
    width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center;
    background: var(--soft); border: 1px solid var(--border-strong); color: var(--text); transition: transform 0.2s;
  }
  .theme-toggle:hover { transform: rotate(-15deg); }
  .theme-toggle .moon { display: block; }
  .theme-toggle .sun { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: none; }
  [data-theme="dark"] .theme-toggle .sun { display: block; }

  /* ---------- main layout ---------- */
  .main { display: grid; grid-template-columns: minmax(380px, 1fr) 1.15fr; gap: 18px; padding: 18px 24px 24px; min-height: 0; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
    backdrop-filter: blur(16px); min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- chat ---------- */
  .chat { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
  .chat::-webkit-scrollbar, .details::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb, .details::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; }

  .welcome { text-align: center; padding: 32px 8px 8px; }
  .welcome h2 {
    font-size: 30px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.02em;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .welcome p { color: var(--muted); margin: 0 auto 28px; max-width: 420px; font-size: 14px; line-height: 1.6; }
  .suggestions { display: grid; gap: 10px; text-align: left; }
  .suggestion {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 16px; border-radius: 12px; cursor: pointer; font: inherit; font-size: 14px;
    color: var(--text); background: var(--soft); border: 1px solid var(--border);
    transition: all 0.2s ease; text-align: left;
  }
  .suggestion:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateX(4px); }
  .suggestion span { color: var(--accent); font-size: 16px; }

  .msg-user { display: flex; justify-content: flex-end; margin: 22px 0 12px; animation: rise 0.3s ease; }
  .msg-user div {
    max-width: 85%; padding: 11px 16px; border-radius: 16px 16px 4px 16px; color: #fff;
    background: var(--gradient); font-size: 14px; font-weight: 500; line-height: 1.5;
    box-shadow: 0 6px 20px rgba(79, 127, 232, 0.25);
  }
  .msg-bot {
    background: var(--soft); border: 1px solid var(--border);
    border-radius: 4px 16px 16px 16px; padding: 16px 18px; animation: rise 0.3s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .pipeline { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
  .stage {
    font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px;
    color: var(--muted); background: var(--soft); border: 1px solid transparent; transition: all 0.3s;
  }
  .stage.done { color: var(--done-text); background: var(--done-bg); }
  .stage.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); animation: pulse 1.2s infinite; }
  .arrow { color: var(--placeholder); font-size: 11px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }

  .answer { font-size: 14.5px; line-height: 1.7; }
  .answer p { margin: 0 0 8px; }
  .answer ul, .answer ol { margin: 4px 0 8px; padding-left: 20px; }
  .answer strong { color: var(--strong); }
  .answer table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .answer th, .answer td { border: 1px solid var(--border-strong); padding: 6px 10px; }
  .answer.error { color: var(--error); }
  .typing { display: inline-flex; gap: 5px; padding: 6px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .meta { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .meta-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .link-btn { background: none; border: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
    font-size: 12px; cursor: pointer; border: 1px solid; font-family: inherit; color: var(--text);
    transition: transform 0.15s;
  }
  .chip:hover { transform: translateY(-2px); }
  .chip small { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  pre.query {
    margin: 10px 0 0; padding: 12px 14px; border-radius: 10px; overflow-x: auto;
    background: var(--code-bg); border: 1px solid var(--border);
    font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--code-text); line-height: 1.55;
  }

  /* ---------- composer ---------- */
  .composer { padding: 16px; border-top: 1px solid var(--border); }
  .quick-samples { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .quick-samples::-webkit-scrollbar { display: none; }
  .quick-btn {
    white-space: nowrap; flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 12px;
    background: var(--soft); border: 1px solid var(--border-strong); color: var(--text); cursor: pointer;
    transition: all 0.2s ease;
  }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .composer form {
    display: flex; gap: 10px; align-items: center; padding: 6px 6px 6px 16px; border-radius: 14px;
    background: var(--input); border: 1px solid var(--border-strong); transition: border-color 0.2s, box-shadow 0.2s;
  }
  .composer form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .composer input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text); font: inherit; font-size: 14.5px; padding: 8px 0; }
  .composer input::placeholder { color: var(--placeholder); }
  .send {
    width: 42px; height: 42px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--gradient); display: grid; place-items: center; transition: transform 0.15s, opacity 0.2s;
  }
  .send:hover { transform: scale(1.05); }
  .send:disabled { opacity: 0.45; cursor: wait; transform: none; }

  /* ---------- graph panel ---------- */
  .graph-panel { position: relative; }
  .graph-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .graph-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .graph-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .btn {
    padding: 7px 12px; border-radius: 9px; font: inherit; font-size: 12px; cursor: pointer;
    color: var(--text); background: var(--soft); border: 1px solid var(--border-strong);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  #network { flex: 1; min-height: 300px; }
  .legend {
    position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px;
    max-width: calc(100% - 28px);
  }
  .legend .pill { background: var(--overlay); backdrop-filter: blur(8px); cursor: pointer; }
  .legend .pill:hover { border-color: var(--accent); }
  .legend .swatch { width: 9px; height: 9px; border-radius: 3px; }
  .details {
    position: absolute; top: 72px; right: 14px; width: 260px; max-height: calc(100% - 140px); overflow-y: auto;
    background: var(--overlay); border: 1px solid var(--border-strong); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow); animation: rise 0.2s ease;
  }
  .details h4 { margin: 4px 0 12px; font-size: 16px; }
  .details .type { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .details dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
  .details dt { color: var(--muted); text-transform: capitalize; }
  .details dd { margin: 0; word-break: break-word; }
  .details .close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .details .links { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.8; }

  @media (max-width: 960px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; }
    .main { grid-template-columns: 1fr; padding: 14px 16px; }
    .chat-panel { height: 75vh; }
    .graph-panel { height: 520px; }
    .topbar { padding: 12px 16px; }
    .top-right { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
          <circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/>
          <path d="M8.3 7l7.3 0.8M7 8.3l2.2 7.3M16.5 10.2l-4.8 6"/>
        </svg>
      </div>
      <div>
        <h1>GraphMind</h1>
        <p>AI retrieval over an e-commerce knowledge graph</p>
      </div>
    </div>
    <div class="top-right">
      <div class="stats" id="stats"></div>
      <button class="theme-toggle" id="theme" title="Switch theme">
        <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="panel chat-panel">
      <div class="chat" id="chat">
        <div class="welcome" id="welcome">
          <h2>Ask your store anything</h2>
          <p>Questions are turned into graph queries, answered only from the data found in the knowledge graph, and highlighted on the map.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>
      <div class="composer">
        <div class="quick-samples" id="quick-samples"></div>
        <form id="form">
          <input id="question" placeholder="Ask about products, brands, vendors, orders..." autocomplete="off">
          <button class="send" id="send" type="submit" title="Ask">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </div>
    </section>

    <section class="panel graph-panel">
      <div class="graph-head">
        <div>
          <h3>Knowledge Graph</h3>
          <p id="graph-hint">Click a node to see its details. Drag to explore.</p>
        </div>
        <button class="btn" id="reset">Show full graph</button>
      </div>
      <div id="network"></div>
      <div class="legend" id="legend"></div>
      <div class="details" id="details" hidden></div>
    </section>
  </main>
</div>

<script>
  const STAGES = ["Question", "LLM", "Graph Query", "Retrieve", "LLM", "Answer"];
  const COLORS = ["#8b7cf6", "#10b981", "#f59e0b", "#ec4899", "#0ea5e9", "#f97316", "#84cc16", "#ef4444"];
  const typeColor = {};
  let rawNodes = {}, nodeSet, edgeSet, network;
  let highlighted = [];  // node ids currently highlighted, kept so a theme switch can redraw them

  const $ = (id) => document.getElementById(id);
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
  }

  function colorOf(type) {
    return typeColor[type] || COLORS[0];
  }

  // ---------- theme ----------
  $("theme").onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    if (network) highlight(highlighted, false);
  };

  // ---------- header stats ----------
  async function loadStats() {
    const data = await (await fetch("/stats")).json();
    Object.keys(data.types).forEach((type, i) => typeColor[type] = COLORS[i % COLORS.length]);
    $("stats").innerHTML = `
      <span class="pill"><span class="dot"></span><b>${escapeHtml(data.model)}</b></span>
      <span class="pill"><b>${data.nodes}</b> nodes</span>
      <span class="pill"><b>${data.edges}</b> relationships</span>
      <span class="pill"><b>${Object.keys(data.types).length}</b> entity types</span>`;
    $("legend").innerHTML = Object.entries(data.types).map(([type, count]) =>
      `<span class="pill" data-type="${escapeHtml(type)}"><span class="swatch" style="background:${colorOf(type)}"></span>${escapeHtml(type)} <b>${count}</b></span>`
    ).join("");
    $("legend").querySelectorAll("[data-type]").forEach((el) => {
      el.onclick = () => highlight(Object.values(rawNodes).filter((n) => n.label === el.dataset.type).map((n) => n.id));
    });
  }

  // ---------- sample questions ----------
  async function loadSamples() {
    const questions = await (await fetch("/samples")).json();
    questions.forEach((q) => {
      // Welcome screen suggestion
      const btn = document.createElement("button");
      btn.className = "suggestion";
      btn.innerHTML = `<span>✦</span>${escapeHtml(q)}`;
      btn.onclick = () => ask(q);
      $("suggestions").appendChild(btn);

      // Persistent quick button above search box
      const qbtn = document.createElement("button");
      qbtn.className = "quick-btn";
      qbtn.textContent = q;
      qbtn.onclick = () => ask(q);
      $("quick-samples").appendChild(qbtn);
    });
  }

  // ---------- graph drawing ----------
  function nodeStyle(node, dimmed) {
    const color = colorOf(node.label);
    const outline = cssVar("--text");
    return {
      id: node.id,
      label: String(node.name || node.id),
      color: {
        background: dimmed ? cssVar("--node-dim") : color,
        border: dimmed ? cssVar("--node-dim-border") : color,
        highlight: { background: color, border: outline },
        hover: { background: color, border: outline },
      },
      font: { color: dimmed ? cssVar("--node-label-dim") : cssVar("--node-label"), size: 13, face: "Inter" },
      size: node.label === "Product" ? 16 : 20,
      borderWidth: dimmed ? 1 : 2,
      shadow: dimmed ? false : { enabled: true, color: color + "66", size: 16, x: 0, y: 0 },
    };
  }

  async function loadGraph() {
    const data = await (await fetch("/graph")).json();
    data.nodes.forEach((n) => rawNodes[n.id] = n);

    nodeSet = new vis.DataSet(data.nodes.map((n) => nodeStyle(n, false)));
    edgeSet = new vis.DataSet(data.edges.map((e, i) => ({
      id: i, from: e.from, to: e.to, title: e.type,
      color: { color: cssVar("--edge"), highlight: cssVar("--edge-strong") },
    })));

    network = new vis.Network($("network"), { nodes: nodeSet, edges: edgeSet }, {
      nodes: { shape: "dot" },
      edges: { width: 1.2, smooth: { type: "continuous" }, arrows: { to: { enabled: true, scaleFactor: 0.4 } } },
      physics: { barnesHut: { gravitationalConstant: -5000, springLength: 130 }, stabilization: { iterations: 250 } },
      interaction: { hover: true, tooltipDelay: 120 },
    });
    network.once("stabilizationIterationsDone", () => network.setOptions({ physics: false }));
    network.on("click", (e) => e.nodes.length ? showDetails(e.nodes[0]) : ($("details").hidden = true));
  }

  function highlight(ids, zoom = true) {
    highlighted = ids;
    const keep = new Set(ids);
    nodeSet.update(Object.values(rawNodes).map((n) => nodeStyle(n, keep.size > 0 && !keep.has(n.id))));
    edgeSet.update(edgeSet.get().map((e) => {
      let color = cssVar("--edge");
      if (keep.size) color = keep.has(e.from) && keep.has(e.to) ? cssVar("--edge-strong") : cssVar("--edge-faint");
      return { id: e.id, color: { color, highlight: cssVar("--edge-strong") } };
    }));
    if (zoom) network.fit({ nodes: keep.size ? [...keep] : undefined, animation: { duration: 700, easingFunction: "easeInOutQuad" } });
    $("graph-hint").textContent = keep.size ? `Highlighting ${keep.size} node(s)` : "Click a node to see its details. Drag to explore.";
  }

  function showDetails(id) {
    const node = rawNodes[id];
    const props = Object.entries(node).filter(([k]) => k !== "label" && k !== "id");
    const links = edgeSet.get().filter((e) => e.from === id || e.to === id).map((e) => {
      const other = rawNodes[e.from === id ? e.to : e.from];
      return `${e.from === id ? "→" : "←"} ${escapeHtml(e.title)} · ${escapeHtml(other.name || other.id)}`;
    });
    $("details").innerHTML = `
      <button class="close" onclick="this.parentElement.hidden = true">×</button>
      <div class="type" style="color:${colorOf(node.label)}">${escapeHtml(node.label)} · ${escapeHtml(node.id)}</div>
      <h4>${escapeHtml(node.name || node.id)}</h4>
      <dl>${props.map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join("")}</dl>
      <div class="links">${links.join("<br>")}</div>`;
    $("details").hidden = false;
    network.selectNodes([id]);
  }

  // ---------- chat ----------
  function renderStages(el, active) {
    el.innerHTML = STAGES.map((s, i) =>
      `<span class="stage ${i < active ? "done" : i === active ? "active" : ""}">${s}</span>` +
      (i < STAGES.length - 1 ? `<span class="arrow">›</span>` : "")
    ).join("");
  }

  function addMessage(question) {
    $("welcome").hidden = true;
    const user = document.createElement("div");
    user.className = "msg-user";
    user.innerHTML = `<div>${escapeHtml(question)}</div>`;

    const bot = document.createElement("div");
    bot.className = "msg-bot";
    bot.innerHTML = `<div class="pipeline"></div><div class="answer"><span class="typing"><i></i><i></i><i></i></span></div>`;

    $("chat").append(user, bot);
    $("chat").scrollTop = $("chat").scrollHeight;
    return bot;
  }

  function renderResult(bot, data) {
    bot.querySelector(".answer").innerHTML = DOMPurify.sanitize(marked.parse(data.answer));

    // nodes found by the query plus the path to the related nodes that made them match
    const found = data.results.map((r) => r.id);
    const related = data.results.flatMap((r) => (r.matched_related || []).flatMap((m) => m.path_nodes));
    const ids = [...new Set([...found, ...related])];

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `
      <div class="meta-row">
        <span class="meta-title">${data.results_found} node(s) retrieved from graph</span>
        <span>
          ${ids.length ? `<button class="link-btn" data-action="show">Show on graph</button> · ` : ""}
          <button class="link-btn" data-action="query">View graph query</button>
        </span>
      </div>
      <div class="chips">${data.results.map((r) => {
        const c = colorOf(r.label);
        return `<button class="chip" data-id="${escapeHtml(r.id)}" style="border-color:${c}66;background:${c}14">
                  <small style="color:${c}">${escapeHtml(r.label)}</small>${escapeHtml(r.name || r.id)}</button>`;
      }).join("")}</div>
      <pre class="query" hidden>${escapeHtml(JSON.stringify(data.graph_query, null, 2))}</pre>`;
    bot.appendChild(meta);

    meta.querySelectorAll(".chip").forEach((chip) => chip.onclick = () => showDetails(chip.dataset.id));
    const showBtn = meta.querySelector('[data-action="show"]');
    if (showBtn) showBtn.onclick = () => highlight(ids);
    meta.querySelector('[data-action="query"]').onclick = (e) => {
      const pre = meta.querySelector("pre");
      pre.hidden = !pre.hidden;
      e.target.textContent = pre.hidden ? "View graph query" : "Hide graph query";
    };

    highlight(ids);
  }

  async function ask(text) {
    const question = (text || $("question").value).trim();
    if (!question) return;
    $("question").value = "";
    $("send").disabled = true;

    const bot = addMessage(question);
    const stages = bot.querySelector(".pipeline");
    let stage = 1;
    renderStages(stages, stage);
    const timer = setInterval(() => { if (stage < 4) renderStages(stages, ++stage); }, 800);

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Something went wrong");
      renderStages(stages, STAGES.length);
      renderResult(bot, data);
    } catch (err) {
      const answer = bot.querySelector(".answer");
      answer.className = "answer error";
      answer.textContent = err.message;
    } finally {
      clearInterval(timer);
      $("send").disabled = false;
      $("question").focus();
      $("chat").scrollTop = $("chat").scrollHeight;
    }
  }

  $("form").onsubmit = (e) => { e.preventDefault(); ask(); };
  $("reset").onclick = () => { highlight([]); $("details").hidden = true; };

  loadStats().then(loadGraph);
  loadSamples();
</script>
</body>
</html>
